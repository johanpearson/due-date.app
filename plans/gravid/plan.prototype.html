<script>/* core/requirements.js */
/* reqplan core - requirement sources (product-oracle export, brief, synthetic files) normalized to one shape. Shared by the CLI (Node) and the viewer (browser); assembled by core/index.js. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory({ base: require('./base.js') });
  else (root.ReqPlanCoreParts = root.ReqPlanCoreParts || {}).requirements = factory(root.ReqPlanCoreParts);
})(typeof globalThis !== 'undefined' ? globalThis : this, function (parts) {
  'use strict';

  const { asArray, str, isObject, pick } = parts.base;

  // ───────────────────────── Requirements ─────────────────────────

  const hasAny = (obj, keys) => keys.some((k) => obj[k]);

  function emptyRequirements() {
    return {
      __reqplan_normalized: true,
      sources: [],
      product: null,
      revision: null,
      phases: [],
      requirements: [],
      assumptions: [],
      open_questions: [],
      conflicts: [],
    };
  }

  // Structured acceptance criteria, in the order they are recognised.
  const STRUCTURED_FORMS = [
    [['given', 'when', 'then'], (s) => `Given ${str(s.given)}, when ${str(s.when)}, then ${str(s.then)}`],
    [['condition', 'expected_result'], (s) => `${str(s.condition)} → ${str(s.expected_result)}`],
    [['input', 'expected_output'], (s) => `Input: ${str(s.input)} → Output: ${str(s.expected_output)}`],
  ];

  function describeStructured(s) {
    if (!isObject(s)) return '';
    const form = STRUCTURED_FORMS.find(([keys]) => hasAny(s, keys));
    return form ? form[1](s) : '';
  }

  const scenarioOf = (ac) => (hasAny(ac, ['given', 'when', 'then']) ? { form: 'scenario', given: ac.given, when: ac.when, then: ac.then } : null);
  const acText = (ac, structured) => str(pick(ac, ['text_representation', 'text'], '') || describeStructured(structured) || ac.title);
  const acForm = (ac, structured) => str(ac.form || (structured && structured.form) || 'assertion');

  function normalizeAc(ac, reqId) {
    if (typeof ac === 'string') return { id: ac, req: reqId, title: '', text: '', form: 'assertion', structured: null, status: '' };
    const structured = ac.structured_representation || scenarioOf(ac);
    return {
      id: str(ac.id),
      req: str(ac.requirement_id || reqId),
      title: str(ac.title),
      text: acText(ac, structured),
      form: acForm(ac, structured),
      structured,
      status: str(ac.status),
    };
  }

  // ACs listed on the requirement (ids resolve against top-level ACs), in their order, without duplicates.
  const acRefId = (ref) => (typeof ref === 'string' ? ref : ref && ref.id);
  const resolveAcRef = (ref, refId, topAcs) => (typeof ref === 'string' ? topAcs.get(refId) || ref : ref);

  function listedAcs(r, id, topAcs, seen) {
    const acs = [];
    for (const ref of asArray(r.acceptance_criteria)) {
      const refId = acRefId(ref);
      if (!refId || seen.has(refId)) continue;
      seen.add(refId);
      acs.push(normalizeAc(resolveAcRef(ref, refId, topAcs), id));
    }
    return acs;
  }

  // Top-level ACs that point at the requirement but are not listed on it.
  function joinedAcs(id, topAcs, seen) {
    const acs = [];
    for (const ac of topAcs.values()) {
      if (ac.requirement_id !== id || seen.has(ac.id)) continue;
      seen.add(ac.id);
      acs.push(normalizeAc(ac, id));
    }
    return acs;
  }

  function normalizeRequirement(r, topAcs, synthetic) {
    const id = str(r.id);
    const seen = new Set();
    const acs = [...listedAcs(r, id, topAcs, seen), ...joinedAcs(id, topAcs, seen)];
    return {
      id,
      title: str(r.title),
      statement: str(pick(r, ['statement'], r.description)),
      type: str(pick(r, ['type'], 'functional_requirement')),
      strength: str(pick(r, ['normative_strength', 'strength'], '')),
      status: str(pick(r, ['status'], '')),
      phase: str(pick(r, ['target_phase', 'phase'], '')),
      rationale: str(pick(r, ['rationale', 'why'], '')),
      verification: str(pick(r, ['verification_note'], '')),
      parent: pick(r, ['parent_id'], null),
      children: asArray(r.children_ids),
      dependencies: asArray(r.dependencies),
      flags: asArray(r.flags),
      negative_scope: !!r.negative_scope,
      synthetic: !!(synthetic || r.synthetic),
      acs,
    };
  }

  const relatedOf = (o) => asArray(pick(o, ['related_requirements', 'related'], o.affected_requirements));

  // ───────── one requirements source ─────────

  const SOURCE_LABELS = {
    'product-oracle': 'product-oracle export', 'product-oracle-mcp': 'product-oracle requirements (MCP)',
    brief: 'requirements drafted from a brief', synthetic: 'synthetic requirements', file: 'requirements file',
  };
  const isSynthetic = (src) => src.source === 'synthetic' || src.synthetic === true;

  // Export markers win over the declared "source". MCP results declare "source": "product-oracle".
  function sourceType(src) {
    if (hasAny(src, ['export_version', 'active_revision'])) return 'product-oracle';
    if (src.source === 'product-oracle') return 'product-oracle-mcp';
    if (src.source === 'brief') return 'brief';
    return isSynthetic(src) ? 'synthetic' : 'file';
  }

  const sourceKind = (src) => (sourceType(src) === 'product-oracle-mcp' ? 'product-oracle' : sourceType(src));

  // A brief keeps the user's own words and whether the user confirmed the requirements drafted from them.
  const briefFields = (src) => ({ brief: str(src.brief || ''), confirmed: src.confirmed === true });

  function sourceEntry(src, label) {
    const kind = sourceKind(src);
    const entry = { kind, label: str(label || SOURCE_LABELS[sourceType(src)]), exported_at: str(src.exported_at || ''), note: str(pick(src, ['note', 'description'], '')) };
    return kind === 'brief' ? { ...entry, ...briefFields(src) } : entry;
  }

  const productOf = (p) => (p ? { name: str(p.name), description: str(pick(p, ['description'], p.vision)) } : null);
  const revisionOf = (r) => (r ? { id: str(r.id), version: str(r.version), status: str(r.status), summary: str(r.summary || '') } : null);
  const phaseOf = (p) => ({ id: str(p.id), name: str(pick(p, ['name'], p.id)), order: p.order || 0 });
  const assumptionOf = (a) => ({
    id: str(a.id), text: str(pick(a, ['statement'], a.text)), status: str(a.status), level: str(a.risk_level || ''), related: relatedOf(a),
  });
  const questionOf = (q) => ({
    id: str(q.id), text: str(pick(q, ['question'], q.text)), status: str(q.status), level: str(q.priority || ''), related: relatedOf(q), answer: str(q.answer || ''),
  });
  const conflictOf = (c) => ({
    id: str(c.id), text: str(pick(c, ['summary'], c.text)), status: str(c.status), level: str(c.severity || ''), related: relatedOf(c),
  });

  function topLevelAcs(src) {
    const topAcs = new Map();
    for (const ac of asArray(src.acceptance_criteria)) if (ac && ac.id) topAcs.set(ac.id, ac);
    return topAcs;
  }

  function normalizeSource(src, label) {
    const synthetic = isSynthetic(src) && sourceKind(src) !== 'brief';
    const topAcs = topLevelAcs(src);
    const out = emptyRequirements();
    out.sources.push(sourceEntry(src, label));
    out.product = productOf(src.product);
    out.revision = revisionOf(src.active_revision);
    out.phases = asArray(src.phases).map((p) => phaseOf(p));
    out.requirements = asArray(src.requirements).map((r) => normalizeRequirement(r, topAcs, synthetic));
    out.assumptions = asArray(src.assumptions).map((a) => assumptionOf(a));
    out.open_questions = asArray(src.open_questions).map((q) => questionOf(q));
    out.conflicts = asArray(src.conflicts).map((c) => conflictOf(c));
    return out;
  }

  // An export may be wrapped in an API envelope { data: ... }; a bare array is a list of requirements.
  const hasEnvelope = (input) => isObject(input.data) && hasAny(input.data, ['requirements', 'export_version']);

  function unwrap(input) {
    const src = hasEnvelope(input) ? input.data : input;
    return Array.isArray(src) ? { requirements: src } : src;
  }

  const isSourceList = (input) => Array.isArray(input) && input.every((x) => isObject(x) && !x.id);

  /**
   * Accepts any of:
   *  - a product-oracle baseline export (GET /api/export), optionally wrapped in { data: ... }
   *  - a simple file { source?: "synthetic" | "brief", requirements: [{ id, title, statement, acceptance_criteria: [{ id, text }] }] }
   *    ("brief" adds brief: the user's own words, and confirmed: true once the user agreed with the drafted requirements)
   *  - an array of the above (merged)
   *  - an already-normalized object
   */
  function normalizeRequirements(input, label) {
    if (!input) return emptyRequirements();
    if (isSourceList(input)) return mergeRequirements(input.map((x, i) => normalizeRequirements(x, label ? `${label}[${i}]` : undefined)));
    if (input.__reqplan_normalized) return input;
    return normalizeSource(unwrap(input), label);
  }

  function mergeRequirements(list) {
    const out = emptyRequirements();
    for (const r of list) {
      out.sources.push(...r.sources);
      out.product = out.product || r.product;
      out.revision = out.revision || r.revision;
      for (const k of ['phases', 'requirements', 'assumptions', 'open_questions', 'conflicts']) out[k].push(...r[k]);
    }
    return out;
  }

  return { normalizeRequirements, normalizeRequirement };

});

</script>
<script>/* core/walk.js */
/* reqplan core - walks a plan into a flat list of traceable nodes with stable keys. Shared by the CLI (Node) and the viewer (browser); assembled by core/index.js. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory({ base: require('./base.js') });
  else (root.ReqPlanCoreParts = root.ReqPlanCoreParts || {}).walk = factory(root.ReqPlanCoreParts);

  // Unchanged existing items are context for the change, not scope creep.
  const isUntracedTopLevel = (ctx, n) => TOP_LEVEL_KINDS.has(n.kind) && n.change !== 'existing' && !(ctx.deepRefs.get(n.key) || new Set()).size;

  function isUnknownElement(n) {
    if (n.kind !== 'element' || !n.obj.type) return false;
    return !ELEMENT_TYPES.has(str(n.obj.type));
  }

  function reportCoverageGaps(ctx) {
    for (const id of ctx.scopeIds) reportRequirementCoverage(ctx, id);
  }

  function reportUnusedSynthetic(ctx) {
    for (const r of ctx.synthetic) {
      if (isUnusedSynthetic(ctx, r)) ctx.issue('warning', `Synthetic requirement ${r.id} is not used by any plan item`, `req:${r.id}`);
    }
  }

  function reportUntraced(ctx) {
    ctx.untracedKeys = ctx.nodes.filter((n) => isUntracedTopLevel(ctx, n)).map((n) => n.key);
    for (const key of ctx.untracedKeys) {
      const n = ctx.nodeByKey.get(key);
      ctx.issue('info', `${n.kind} "${n.label}" does not trace to any requirement (scope creep or missing requirement?)`, key);
    }
  }

  // ───────── how to test it ─────────

  const isVerification = (ctx, key) => ctx.nodeByKey.get(key).kind === 'verification';
  const verificationKeys = (ctx, ids) => [...new Set(ids.flatMap((id) => ctx.refIndex.get(id) || []))].filter((key) => isVerification(ctx, key));

  /** Plan verification entries per requirement, found through the requirement or any of its ACs. */
  function indexTests(ctx) {
    ctx.testsByReq = new Map();
    for (const r of ctx.allReqs) ctx.testsByReq.set(r.id, verificationKeys(ctx, [r.id, ...r.acs.map((ac) => ac.id)]));
  }

  const isUntested = (ctx, r) => !r.verification && !ctx.testsByReq.get(r.id).length;

  function reportUntested(ctx) {
    const untested = [...ctx.scopeIds].map((id) => ctx.reqById.get(id)).filter((r) => r && isUntested(ctx, r));
    for (const r of untested) {
      ctx.issue('info', `${r.id} "${r.title}" has no verification note or verification entry: say how to test it`, `req:${r.id}`);
    }
  }

  function reportUnknownElements(ctx) {
    for (const n of ctx.nodes) {
      if (isUnknownElement(n)) ctx.issue('warning', `${n.label}: unknown element type "${n.obj.type}" (rendered as placeholder)`, n.key);
    }
  }

  // ───────── theme ─────────

  const isGap = (c) => c.status === 'uncovered' || c.status === 'partial';

  function hintStyling(ctx, id) {
    const r = ctx.reqById.get(id);
    const c = ctx.coverage.get(id);
    if (!r || !c) return;
    if (isGap(c) && STYLE_RE.test(`${r.title} ${r.statement}`)) {
      ctx.issue('info', `${id} "${r.title}" looks like a styling requirement: express it in "theme" (tokens) and add ${id} to theme.satisfies`, `req:${id}`);
    }
  }

  function reportTheme(ctx, plan) {
    ctx.theme = resolveTheme(plan);
    const at = ctx.nodeByKey.has('theme') ? 'theme' : null;
    for (const ti of ctx.theme.issues) ctx.issue(ti.level, ti.message, at);
    if (!asArray(plan.screens).length) return;
    for (const id of ctx.scopeIds) hintStyling(ctx, id);
  }

  // ───────── requirements drafted from a brief ─────────

  // Product-oracle ids (REQ-Sub7mK2a). A brief is a separate source and must not borrow that namespace.
  const ORACLE_ID_RE = /^(REQ|AC|QRQ|BRU|PH|IMP|CHK)-[A-Za-z0-9]{8}$/;
  const ORACLE_MIX_MESSAGE = 'Requirements drafted from a brief cannot be combined with product-oracle requirements (an export or MCP results): product-oracle is the source of truth. Put what it lacks in "synthetic_requirements" instead';
  const UNCONFIRMED_MESSAGE = 'The requirements drafted from the brief are not confirmed: show them to the user and set "confirmed": true once they agree';

  const oracleLikeIds = (reqs) => reqs.flatMap((r) => [r.id, ...r.acs.map((ac) => ac.id)]).filter((id) => ORACLE_ID_RE.test(id));

  function reportBriefSources(ctx) {
    const briefs = ctx.reqs.sources.filter((s) => s.kind === 'brief');
    if (!briefs.length) return;
    if (ctx.reqs.sources.some((s) => s.kind === 'product-oracle')) {
      ctx.issue('error', ORACLE_MIX_MESSAGE);
      return;
    }
    if (briefs.some((s) => !s.confirmed)) ctx.issue('warning', UNCONFIRMED_MESSAGE);
    for (const id of oracleLikeIds(ctx.reqs.requirements)) {
      ctx.issue('warning', `"${id}" looks like a product-oracle id, but this plan's requirements come from a brief: give them your own prefix (e.g. BR-1)`, `req:${id}`);
    }
  }

  // ───────── stats ─────────

  function planCounts(plan) {
    return {
      screens: asArray(plan.screens).length,
      interfaces: asArray(plan.interfaces || plan.api).length,
      flows: asArray(plan.flows).length,
      entities: asArray(plan.entities).length,
      components: asArray(plan.components).length,
      decisions: asArray(plan.decisions).length,
      questions: asArray(plan.open_questions).length,
      milestones: asArray(plan.milestones).length,
      verification: asArray(plan.verification).length,
    };
  }

  const COUNTED_STATUSES = new Set(['covered', 'partial', 'uncovered']);
  const ISSUE_COUNTERS = new Map([['error', 'errors'], ['warning', 'warnings']]);

  function countCoverage(stats, c) {
    if (!c) return;
    if (COUNTED_STATUSES.has(c.status)) stats[c.status]++;
    stats.acsInScope += c.acs.length;
    stats.acsTraced += c.acCovered;
  }

  function computeStats(ctx) {
    const stats = {
      inScope: ctx.scopeIds.size,
      covered: 0, partial: 0, uncovered: 0, deferred: ctx.excluded.size,
      acsInScope: 0, acsTraced: 0,
      synthetic: ctx.synthetic.length,
      ...planCounts(ctx.plan),
      errors: 0, warnings: 0, infos: 0,
    };
    for (const id of ctx.scopeIds) countCoverage(stats, ctx.coverage.get(id));
    stats.coveragePct = stats.inScope ? Math.round(((stats.covered + stats.partial * 0.5) / stats.inScope) * 100) : 100;
    for (const i of ctx.issues) stats[ISSUE_COUNTERS.get(i.level) || 'infos']++;
    return stats;
  }

  // The checks run in this order, which is also the order of the reported issues.
  const PHASES = [
    indexRequirements, indexNodes, annotateChanges, indexRefs, checkNavigation, checkFlows, checkEntities, checkComponents,
    checkMilestoneRefs, checkQuestionRefs, collectDeepRefs, resolveScope, computeCoverage, indexTests,
    reportCoverageGaps, reportUnusedSynthetic, reportUntested, reportUntraced, reportUnknownElements, reportTheme, reportBriefSources, reportChanges,
  ];

  function analyze(plan, requirementsInput) {
    plan = plan || {};
    const ctx = newContext(plan, requirementsInput);
    for (const phase of PHASES) phase(ctx, plan);
    const stats = computeStats(ctx);
    return {
      plan, reqs: ctx.reqs, synthetic: ctx.synthetic, allReqs: ctx.allReqs, reqById: ctx.reqById, acById: ctx.acById,
      nodes: ctx.nodes, nodeByKey: ctx.nodeByKey, children: ctx.children, refIndex: ctx.refIndex, deepRefs: ctx.deepRefs,
      coverage: ctx.coverage, testsByReq: ctx.testsByReq, scopeIds: ctx.scopeIds, excluded: ctx.excluded, issues: ctx.issues, stats,
      resolvePlanRef: ctx.resolvePlanRef, theme: ctx.theme, untracedKeys: ctx.untracedKeys, changes: ctx.changes,
    };
  }

  const ELEMENT_TYPES = new Set([
    'heading', 'text', 'input', 'textarea', 'select', 'checkbox', 'radio', 'toggle', 'upload', 'button', 'link',
    'table', 'list', 'card', 'row', 'section', 'stat', 'alert', 'image', 'tabs', 'chart', 'terminal', 'divider',
    'badge', 'code', 'progress', 'search', 'empty',
  ]);

  return { analyze, ELEMENT_TYPES, INACTIVE_STATUSES };

});

<script>/* viewer-base.js */
/* reqplan viewer - shared state and helpers. Plain script; shares global scope with the other viewer-*.js files. */
'use strict';

const RC = window.ReqPlanCore;
const esc = RC.escapeHtml;
const arr = RC.asArray;

const ICON = {

  step: '▹', entity: '▦', field: '·', component: '⬡', decision: '◆', question: '?', risk: '⚠', milestone: '⚑', verification: '✓', theme: '◑',
};
const KIND = {
  screen: 'Screen', element: 'UI element', state: 'Screen state', interface: 'Interface', flow: 'Flow', transition: 'Transition',
  'flow-state': 'State', message: 'Message', step: 'Process step', entity: 'Entity', field: 'Field', component: 'Component',
  decision: 'Decision', question: 'Open question', risk: 'Risk', milestone: 'Milestone', verification: 'Verification', theme: 'Prototype theme',
};
const IFACE_LABEL = { http: 'HTTP API', event: 'Events', cli: 'CLI', job: 'Jobs', rpc: 'RPC', file: 'Files', other: 'Other' };
const STATUS_LABEL = { covered: 'Covered', partial: 'Partial', uncovered: 'Not covered', deferred: 'Deferred', 'out-of-scope': 'Out of scope' };
const TOP_KINDS = new Set(['screen', 'interface', 'flow', 'entity', 'component']);

let D = null;   // embedded data { plan, requirements, mode, built_at, plan_file }
let P = null;   // plan
let A = null;   // analysis from core
let refRegex = null;
let reviewKey = '';

const S = {
  tab: 'overview', sub: null, screen: null, screenState: null, modal: null, history: [],
  sel: null,            // { type: 'node', key } | { type: 'req', id, ac }
  xray: false, hlReq: null,
  sysSel: {}, sim: {}, form: {}, tabsel: {},
  traceFilter: 'all', traceView: 'list', traceQuery: '',
  draft: '', toast: null, scrollTo: null,
};
let R = { verdict: null, summary: '', comments: {}, answers: {} };

const isReview = () => !D || D.mode !== 'prototype';
const trunc = (s, n) => { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function groupBy(list, fn) {
  const m = new Map();

}

/** Replace known requirement / AC ids in rendered HTML text with clickable chips. */
function linkRefs(html) {

  return html.split(/(<[^>]+>)/).map((part) => (part.startsWith('<') ? part : part.replace(refRegex, (id) => refChip(id)))).join('');
}
const mdx = (s) => linkRefs(RC.md(s));
const inl = (s) => linkRefs(RC.inlineMd(s));

function baseReq(id) {
  const req = A.reqById.get(id);
  if (req) return req;
  const ac = A.acById.get(id);
  return ac ? A.reqById.get(ac.req) : null;
}

function refTitle(id) {
  const req = A.reqById.get(id);
  if (req) return req.title;
  const ac = A.acById.get(id);
  return ac ? (ac.title || ac.text) : 'Unknown reference';
}

function refIsOn(id) {
  if (S.hlReq === id) return true;
  return Boolean(S.sel && S.sel.type === 'req' && (S.sel.ac || S.sel.id) === id);
}

function refChipClass(id) {
  const base = baseReq(id);
  const synthetic = base && base.synthetic;
  return ['chip', 'ref', A.reqById.get(id) ? '' : 'ac', synthetic ? 'syn' : '', base ? '' : 'unk', refIsOn(id) ? 'on' : ''].join(' ');
}

function refChip(id) {

}

function nodeTitle(n) {

function nodeChip(key) {
  const n = A.nodeByKey.get(key);

}

// ───────── existing-project mode: change badges and code references ─────────

const CHANGE_LABEL = { new: 'New', changed: 'Changed', removed: 'Removed', existing: 'Existing' };

function changeOf(key) {

}

function changeBadge(key, withExisting) {

const isHiddenUnchanged = (key) => S.changeFilter === 'changes' && changeOf(key) === 'existing';

function codeText(ref) {

  return `${ref.path}:${ref.line}${ref.end ? `-${ref.end}` : ''}`;
}

function codeRef(ref) {
  const link = A.changes.codebase && A.changes.codebase.link;
  const code = `<code>${esc(codeText(ref))}</code>`;
  if (!link) return code;
  const href = link.split('{path}').join(encodeURI(ref.path.replace(/\\/g, '/')));
  return `<a href="${esc(href)}" target="_blank" rel="noopener">${code}</a>`;
}

function codeRefs(key) {
  const refs = A.changes.code.filter((r) => r.key === key);
  return refs.length ? `<span class="coderefs"><span class="muted small">code </span>${refs.map(codeRef).join(' ')}</span>` : '';

  return `<span class="cp ${esc(status)}">${esc(STATUS_LABEL[status] || status)}</span>`;
}

  if (!r.strength) return '';
  return `<span class="badge ${r.strength === 'must' || r.strength === 'must_not' ? 'must' : r.strength === 'should' ? 'should' : ''}">${esc(r.strength.replace('_', ' '))}</span>`;
}

function typeLabel(t) {
  return { functional_requirement: 'functional', quality_requirement: 'quality', business_rule: 'business rule' }[t] || t;
}

/** Does a set/array of refs touch the highlighted requirement (directly or through one of its ACs)? */
function touches(refs, id) {
  if (!id) return false;
  const has = (x) => (refs instanceof Set ? refs.has(x) : refs.includes(x));
  if (has(id)) return true;
  const req = A.reqById.get(id);
  return !!(req && req.acs.some((ac) => has(ac.id)));

function nodeIsHl(key) {
  return !!S.hlReq && touches(A.deepRefs.get(key) || new Set(), S.hlReq);
}

function isSel(key) {

function reviewMdCommentLine(c) {

  return answers.length ? ['## Answers to open questions', '', ...answers.map((a) => `- **${a.question_id}** ${a.question}\n  → ${a.answer}`), ''] : [];

function reviewMarkdown(rv) {
  const verdict = REVIEW_VERDICT_LABELS[rv.verdict] || 'NO VERDICT YET';
  const out = [`# Review of visual plan: ${rv.plan}`, '', `Verdict: **${verdict}**`, `Plan file: ${rv.plan_file || '(unknown)'} · built ${rv.built_at}`, ''];
  if (rv.summary) out.push('## Overall feedback', '', rv.summary, '');
  out.push(...reviewMdComments(rv.comments), ...reviewMdAnswers(rv.answers));
  if (rv.coverage.uncovered.length) out.push(`Uncovered in-scope requirements: ${rv.coverage.uncovered.join(', ')}`, '');
  out.push('Please revise the plan JSON accordingly, run `reqplan check`, and rebuild.');
  return out.join('\n');
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function toast(text, tone) {
  S.toast = { text, tone: tone || '' };
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { S.toast = null; render(); }, 2600);
}

<script>/* viewer-graph.js */
/* reqplan viewer - tiny layered graph layout + SVG renderers (state machines, processes, data, architecture, sequences). */
'use strict';

function layoutGraph(nodes, edges, o) {
  o = o || {};
  const W = o.w || 150, H = o.h || 46, GX = o.gx || 80, GY = o.gy || 28, PADX = 24, PADY = 46;
  const ids = nodes.map((n) => n.id);
  const has = new Set(ids);
  const E = edges.filter((e) => has.has(e.from) && has.has(e.to));
  const out = new Map(ids.map((i) => [i, []]));
  E.forEach((e) => out.get(e.from).push(e.to));

  // Detect back edges with DFS so cycles don't break layering.
  const mark = new Map();
  const back = new Set();
  const dfs = (u) => {
    mark.set(u, 1);
    for (const v of out.get(u)) {
      if (mark.get(v) === 1) back.add(u + '\u0001' + v);
      else if (!mark.get(v)) dfs(v);
    }
    mark.set(u, 2);
  };
  const indeg = new Map(ids.map((i) => [i, 0]));
  E.forEach((e) => indeg.set(e.to, indeg.get(e.to) + 1));
  const roots = o.start && has.has(o.start) ? [o.start] : [];
  ids.forEach((i) => { if (!indeg.get(i)) roots.push(i); });
  [...roots, ...ids].forEach((i) => { if (!mark.get(i)) dfs(i); });
  const isBack = (e) => e.from === e.to || back.has(e.from + '\u0001' + e.to);

  const layer = new Map(ids.map((i) => [i, 0]));
  for (let k = 0; k < ids.length; k++) {
    let changed = false;
    E.forEach((e) => {
      if (isBack(e)) return;
      if (layer.get(e.to) < layer.get(e.from) + 1) { layer.set(e.to, layer.get(e.from) + 1); changed = true; }
    });
    if (!changed) break;
  }
  const layers = [];
  ids.forEach((i) => { const l = layer.get(i); (layers[l] = layers[l] || []).push(i); });
  for (let l = 0; l < layers.length; l++) layers[l] = layers[l] || [];
  for (let pass = 0; pass < 2; pass++) {
    for (let l = 1; l < layers.length; l++) {
      const pos = new Map(layers[l - 1].map((id, i) => [id, i]));
      const bc = new Map(layers[l].map((id, i) => {
        const ps = E.filter((e) => e.to === id && pos.has(e.from)).map((e) => pos.get(e.from));
        return [id, ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : i];
      }));
      layers[l].sort((a, b) => bc.get(a) - bc.get(b));
    }
  }

  const maxN = Math.max(1, ...layers.map((x) => x.length));
  const innerH = maxN * H + (maxN - 1) * GY;
  const pos = new Map();
  layers.forEach((ls, l) => {
    const lh = ls.length * H + (ls.length - 1) * GY;
    const off = (innerH - lh) / 2;
    ls.forEach((id, i) => pos.set(id, { x: PADX + l * (W + GX), y: PADY + off + i * (H + GY), w: W, h: H }));
  });
  const hasBack = E.some((e) => isBack(e) || layer.get(e.from) >= layer.get(e.to));
  const width = PADX * 2 + Math.max(1, layers.length) * W + Math.max(0, layers.length - 1) * GX;
  const height = PADY + innerH + 24 + (hasBack ? 64 : 0);

  const pairCount = new Map();
  const routed = E.map((e) => {
    const a = pos.get(e.from), b = pos.get(e.to);
    const pk = e.from + '>' + e.to;
    const nth = pairCount.get(pk) || 0;
    pairCount.set(pk, nth + 1);
    let d, lx, ly;
    if (e.from === e.to) {
      const x = a.x + a.w / 2, y = a.y;
      d = `M${x - 18},${y} C${x - 34},${y - 46} ${x + 34},${y - 46} ${x + 18},${y}`;
      lx = x; ly = y - 38 - nth * 12;
    } else if (layer.get(e.to) > layer.get(e.from)) {
      const x1 = a.x + a.w, y1 = a.y + a.h / 2 + nth * 6, x2 = b.x, y2 = b.y + b.h / 2 + nth * 6;
      const dx = Math.max(30, (x2 - x1) / 2);
      d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
      lx = (x1 + x2) / 2; ly = (y1 + y2) / 2 - 6 + nth * 14;
    } else {
      const x1 = a.x + a.w / 2 + 10, y1 = a.y + a.h, x2 = b.x + b.w / 2 - 10, y2 = b.y + b.h;
      const dip = Math.max(y1, y2) + 44 + nth * 16;
      d = `M${x1},${y1} C${x1},${dip} ${x2},${dip} ${x2},${y2}`;
      lx = (x1 + x2) / 2; ly = dip - 10;
    }
    return Object.assign({}, e, { d, lx, ly });
  });
  return { w: width, h: height, pos, edges: routed };
}

function graphEdgeSvg(e) {
  const act = e.key ? ` data-act="sel-node" data-key="${esc(e.key)}"` : '';
  const on = /\bon\b|\bsel\b/.test(e.cls || '');
  const label = e.label ? `<text class="elab" x="${e.lx}" y="${e.ly}">${esc(trunc(e.label, 28))}</text>` : '';
  const title = e.title ? `<title>${esc(e.title)}</title>` : '';
  return `<g class="edge ${e.cls || ''}"${act}><path class="hit" d="${e.d}"/><path class="ln" d="${e.d}" marker-end="url(#${on ? 'rp-arr-on' : 'rp-arr'})"/>` +
    label + title + '</g>';
}

function graphNodeShape(n, p) {
  if (n.shape === 'diamond') return `<polygon points="${p.w / 2},0 ${p.w},${p.h / 2} ${p.w / 2},${p.h} 0,${p.h / 2}"/>`;
  if (n.shape === 'pill') return `<rect width="${p.w}" height="${p.h}" rx="${p.h / 2}"/>`;
  return `<rect width="${p.w}" height="${p.h}" rx="${n.shape === 'round' ? 14 : 7}"/>`;
}

function graphNodeAct(n) {
  return n.act || (n.key ? ` data-act="sel-node" data-key="${esc(n.key)}"` : '');
}

function graphNodeSvg(n, p) {
  const ly = n.sub ? p.h / 2 - 3 : p.h / 2 + 4;
  const sub = n.sub ? `<text x="${p.w / 2}" y="${p.h / 2 + 13}" class="ns">${esc(trunc(n.sub, 25))}</text>` : '';
  return `<g class="gnode ${n.cls || ''}" transform="translate(${p.x},${p.y})"${graphNodeAct(n)}>${graphNodeShape(n, p)}` +
    `<text x="${p.w / 2}" y="${ly}" class="nl">${esc(trunc(n.label, n.shape === 'diamond' ? 16 : 21))}</text>` +
    sub + `<title>${esc(n.title || n.label)}</title></g>`;
}

function svgGraph(nodes, edges, o) {
  const L = layoutGraph(nodes, edges, o);
  const edgeSvg = L.edges.map(graphEdgeSvg).join('');
  const nodeSvg = nodes.filter((n) => L.pos.get(n.id)).map((n) => graphNodeSvg(n, L.pos.get(n.id))).join('');
  return `<div class="gwrap" data-scroll="g-${esc((o && o.id) || '')}"><svg class="graph" width="${L.w}" height="${L.h}" viewBox="0 0 ${L.w} ${L.h}">${edgeSvg}${nodeSvg}</svg></div>`;
}

const SEQ_LAYOUT = { CW: 180, X0: 20, top: 12, hh: 40, rowH: 46 };

function seqParticipant(p) {
  return typeof p === 'string' ? { id: p, label: p } : { id: p.id, label: p.label || p.name || p.id };
}

function seqLifeline(x, height) {
  const { top, hh } = SEQ_LAYOUT;
  return `<line class="life" x1="${x}" y1="${top + hh}" x2="${x}" y2="${height - 4}"/>`;
}

function seqParticipantSvg(p, x, height) {
  const { top, hh } = SEQ_LAYOUT;
  return seqLifeline(x, height) +
    `<g class="gnode part"><rect x="${x - 72}" y="${top}" width="144" height="${hh}" rx="8"/><text class="nl" x="${x}" y="${top + 25}">${esc(trunc(p.label, 20))}</text></g>`;
}

function seqStepState(j, active) {
  if (active < 0) return '';
  if (j === active) return 'on';
  return j < active ? 'done' : 'todo';
}

function seqStepClass(m, state, k) {
  const hl = S.hlReq && touches(arr(m.satisfies), S.hlReq);
  return ['msg', state, m.reply ? 'reply' : '', isSel(k) ? 'sel' : '', hl ? 'hl' : ''].join(' ');
}

function seqStepPath(x1, x2, y, self) {
  if (self) return `M${x1},${y - 10} h40 v18 h-36`;
  return `M${x1},${y} L${x2 + (x2 > x1 ? -3 : 3)},${y}`;
}

function seqStepLabel(m) {
  return m.label || m.message || '';
}

function seqStepTitle(m) {
  const refs = arr(m.satisfies);
  return `<title>${esc(seqStepLabel(m))}${refs.length ? ' · ' + esc(refs.join(', ')) : ''}</title>`;
}

function seqStepSvg(m, j, ctx) {
  const y = ctx.y0 + j * SEQ_LAYOUT.rowH;
  const x1 = ctx.cx(m.from), x2 = ctx.cx(m.to);
  const k = `${ctx.key}/m${j + 1}`;
  const state = seqStepState(j, ctx.active);
  const self = m.from === m.to;
  const path = seqStepPath(x1, x2, y, self);
  const lx = self ? x1 + 46 : (x1 + x2) / 2;
  const anchor = self ? 'start' : 'middle';
  const marker = state === 'on' || isSel(k) ? 'rp-arr-on' : 'rp-arr';
  return `<g class="edge ${seqStepClass(m, state, k)}" data-act="sel-node" data-key="${esc(k)}"><path class="hit" d="${path}"/>` +
    `<path class="ln" d="${path}" marker-end="url(#${marker})"/>` +
    `<text class="elab" x="${lx}" y="${y - 8}" text-anchor="${anchor}" style="text-anchor:${anchor}">${j + 1}. ${esc(trunc(seqStepLabel(m), 38))}</text>` +
    seqStepTitle(m) + '</g>';
}

function seqSvg(f, active, key) {
  const ps = arr(f.participants).map(seqParticipant);
  const steps = arr(f.steps || f.messages);
  const { CW, X0, top, hh, rowH } = SEQ_LAYOUT;
  const y0 = top + hh + 34;
  const idx = new Map(ps.map((p, i) => [p.id, i]));
  const cx = (id) => X0 + (idx.has(id) ? idx.get(id) : 0) * CW + CW / 2;
  const width = X0 * 2 + Math.max(1, ps.length) * CW;
  const height = y0 + steps.length * rowH + 10;
  const ctx = { y0, cx, key, active };
  const parts = ps.map((p) => seqParticipantSvg(p, cx(p.id), height)).join('');
  const msgs = steps.map((m, j) => seqStepSvg(m, j, ctx)).join('');
  return `<div class="gwrap" data-scroll="seq-${esc(f.id)}"><svg class="graph seq" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${parts}${msgs}</svg></div>`;
}

</script>
<script>/* viewer-proto.js */
/* reqplan viewer - clickable prototype: screens, wireframe elements, navigation, modals and states. */
'use strict';

function screenById(id) {
  return arr(P.screens).find((s) => s.id === id);
}

function protoIsCurrent(sid, stateId) {
  return S.screen === sid && S.screenState === stateId;
}

function navigate(target) {
  const [sid, stid] = String(target).split('#');
  const s = screenById(sid);
  if (!s) { toast(`Screen "${sid}" is not part of this plan`, 'bad'); return; }
  if (s.modal) { S.modal = sid; S.tab = 'prototype'; return; }
  const stateId = stid || null;
  if (!protoIsCurrent(sid, stateId)) S.history.push([S.screen, S.screenState]);
  S.screen = sid;
  S.screenState = stateId;
  S.modal = null;
  S.tab = 'prototype';
}

function elAction(el) {
  if (el.disabled) return;
  if (el.close) S.modal = null;
  if (el.toast) toast(el.toast, el.toast_tone || 'ok');
  if (el.goto) navigate(el.goto);
  else if (el.opens) navigate(el.opens);
}

function isActionable(el) {
  return !!(el.goto || el.opens || el.close || el.toast || el.type === 'button' || el.type === 'link');
}

function formVal(key, dflt) {
  return Object.prototype.hasOwnProperty.call(S.form, key) ? S.form[key] : dflt == null ? '' : dflt;
}

function renderEls(list) {
  return arr(list).map(renderEl).join('');
}

function protoElClass(t, key, refs) {
  const hl = S.hlReq && touches(refs, S.hlReq);
  const cls = ['el', 'el-' + t, refs.length ? 'traced' : '', isSel(key) ? 'sel' : '', hl ? 'hl' : ''].join(' ');
  return S.changeView && changeOf(key) ? `${cls} chg-${changeOf(key)}` : cls;
}

function protoXrayBadge(refs) {
  if (!S.xray || !refs.length) return '';
  return `<span class="xb">${esc(refs[0])}${refs.length > 1 ? ` +${refs.length - 1}` : ''}</span>`;
}

// In the Changes view, elements marked new, changed or removed get a corner label.
function protoChangeBadge(el, key) {
  const c = S.changeView && el.change ? changeOf(key) : '';
  return c && c !== 'existing' ? `<span class="cb ${c}">${CHANGE_LABEL[c]}</span>` : '';
}

function protoWidthStyle(el) {
  return el.width ? ` style="flex:0 0 ${esc(el.width)};max-width:${esc(el.width)}"` : '';
}

// The prototype shows the result of the change: removed elements only appear in the Changes view.
const isHiddenRemoved = (key) => !S.changeView && changeOf(key) === 'removed';

function renderEl(el) {
  if (!el || typeof el !== 'object') return '';
  const key = el.__key || '';
  if (isHiddenRemoved(key)) return '';
  const refs = arr(el.satisfies);
  const t = el.type || 'text';
  return `<div class="${protoElClass(t, key, refs)}" data-act="el" data-key="${esc(key)}"${protoWidthStyle(el)}>${protoXrayBadge(refs)}${protoChangeBadge(el, key)}${elInner(el, key, t)}${commentMark(key)}</div>`;
}

function field(el, control) {
  return `<label class="fld"><span class="lbl">${inl(el.label || '')}${el.required ? ' <b class="req">*</b>' : ''}</span>${control}` +
    `${el.hint ? `<span class="hintx">${inl(el.hint)}</span>` : ''}${el.error ? `<span class="err">${inl(el.error)}</span>` : ''}</label>`;
}

function cell(c) {
  if (c && typeof c === 'object') return c.badge ? `<span class="badge ${esc(c.tone || '')}">${esc(c.badge)}</span>` : esc(JSON.stringify(c));
  return inl(c == null ? '' : String(c));
}

function protoTitle(el) {
  return el.title ? `<div class="tblt">${inl(el.title)}</div>` : '';
}

function protoLabelText(el) {
  return el.text || el.label || '';
}

function protoRequired(el) {
  return el.required ? ' <b class="req">*</b>' : '';
}

function protoValueOrEmpty(el) {
  return el.value != null ? el.value : '';
}

function protoHeading(el) {
  const l = Math.min(Math.max(+el.level || 2, 1), 4) + 1;
  return `<h${l} class="ph">${inl(protoLabelText(el))}</h${l}>`;
}

function protoText(el) {
  return `<div class="md">${mdx(protoLabelText(el))}</div>`;
}

function protoInput(el, key, t) {
  const search = t === 'search';
  const type = el.input_type || (search ? 'search' : 'text');
  const placeholder = el.placeholder || (search ? 'Search…' : '');
  return field(el, `<input id="${esc('f-' + key)}" data-bind="form:${esc(key)}" type="${esc(type)}" placeholder="${esc(placeholder)}" value="${esc(formVal(key, el.value))}">`);
}

function protoTextarea(el, key) {
  return field(el, `<textarea id="${esc('f-' + key)}" data-bind="form:${esc(key)}" rows="${+el.rows || 3}" placeholder="${esc(el.placeholder || '')}">${esc(formVal(key, el.value))}</textarea>`);
}

function protoSelect(el, key) {
  const v = String(formVal(key, protoValueOrEmpty(el)));
  const placeholder = el.placeholder ? `<option value="">${esc(el.placeholder)}</option>` : '';
  const options = arr(el.options).map((o) => `<option ${v === String(o) ? 'selected' : ''}>${esc(o)}</option>`).join('');
  return field(el, `<select id="${esc('f-' + key)}" data-bind="form:${esc(key)}">${placeholder}${options}</select>`);
}

function protoCheckbox(el, key, t) {
  const on = !!formVal(key, !!(el.checked || el.value));
  return `<label class="chk ${t}"><input type="checkbox" data-bind="form:${esc(key)}" ${on ? 'checked' : ''}><span>${inl(el.label || '')}</span></label>`;
}

function protoRadio(el, key) {
  const v = String(formVal(key, protoValueOrEmpty(el)));
  const options = arr(el.options).map((o) => `<label class="chk"><input type="radio" name="${esc(key)}" value="${esc(o)}" data-bind="form:${esc(key)}" ${v === String(o) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('');
  return `<div class="fld"><span class="lbl">${inl(el.label || '')}</span><div class="radios">${options}</div></div>`;
}

function protoUpload(el) {
  const accept = el.accept ? ` · ${esc(el.accept)}` : '';
  const hint = el.hint ? `<span class="hintx">${inl(el.hint)}</span>` : '';
  return `<div class="upload"><span class="fld"><span class="lbl">${inl(el.label || 'Upload')}${protoRequired(el)}</span></span><div class="updrop">⇪ Drop a file here or <u>browse</u>${accept}</div>${hint}</div>`;
}

function protoButton(el) {
  return `<button class="btn v-${esc(el.variant || 'secondary')}" ${el.disabled ? 'disabled' : ''} type="button">${inl(el.label || 'Button')}</button>`;
}

function protoLink(el) {
  return `<a class="lnk" href="#">${inl(el.label || el.text || 'Link')}</a>`;
}

function protoTableRow(el, key, cols, r) {
  const cells = Array.isArray(r) ? r : cols.map((c) => (r || {})[c]);
  const attrs = el.row_goto ? ` data-act="row" data-key="${esc(key)}"` : '';
  return `<tr class="${el.row_goto ? 'clk' : ''}"${attrs}>${cells.map((c) => `<td>${cell(c)}</td>`).join('')}</tr>`;
}

function protoTable(el, key) {
  const cols = arr(el.columns);
  const rows = el.rows ? arr(el.rows) : [0, 1, 2].map(() => cols.map(() => '…'));
  return `${protoTitle(el)}<table class="ptbl"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>` +
    rows.map((r) => protoTableRow(el, key, cols, r)).join('') + '</tbody></table>';
}

function protoListItemAttrs(o, key) {
  if (!o.goto && !o.__key) return '';
  return ` data-act="item" data-key="${esc(o.__key || key)}"${o.goto ? ` data-goto="${esc(o.goto)}"` : ''}`;
}

function protoListItemClass(o) {
  const sel = o.__key && isSel(o.__key);
  return `${o.goto ? 'clk' : ''} ${sel ? 'sel' : ''}`;
}

function protoListItemMain(o) {
  const subtitle = o.subtitle ? `<div class="ls">${inl(o.subtitle)}</div>` : '';
  return `<div><div class="lt">${inl(o.title || o.label || '')}</div>${subtitle}</div>`;
}

function protoListItemExtras(o) {
  const meta = o.meta ? `<div class="lm">${inl(o.meta)}</div>` : '';
  const badge = o.badge ? `<span class="badge ${esc(o.tone || '')}">${esc(o.badge)}</span>` : '';
  const xray = S.xray && o.satisfies ? `<span class="xb" style="position:static">${esc(arr(o.satisfies)[0])}</span>` : '';
  return meta + badge + xray + (o.__key ? commentMark(o.__key) : '');
}

function protoListItem(it, key) {
  const o = it && typeof it === 'object' ? it : { title: it };
  return `<li class="${protoListItemClass(o)}"${protoListItemAttrs(o, key)}>${protoListItemMain(o)}${protoListItemExtras(o)}</li>`;
}

function protoList(el, key) {
  return `${protoTitle(el)}<ul class="plist">${arr(el.items).map((it) => protoListItem(it, key)).join('')}</ul>`;
}

function protoCard(el) {
  const title = el.title ? `<div class="card-h">${inl(el.title)}</div>` : '';
  const body = el.body ? `<div class="md">${mdx(el.body)}</div>` : '';
  return `<div class="cardin">${title}${body}${renderEls(el.elements)}</div>`;
}

function protoRow(el) {
  return `<div class="rowc">${renderEls(el.elements)}</div>`;
}

function protoStat(el) {
  const delta = el.delta ? `<div class="sd">${esc(el.delta)}</div>` : '';
  return `<div class="pstat"><div class="sl">${inl(el.label || '')}</div><div class="sv">${esc(el.value == null ? '—' : el.value)}</div>${delta}</div>`;
}

function protoAlert(el) {
  return `<div class="palert ${esc(el.tone || 'info')}">${inl(protoLabelText(el))}</div>`;
}

function protoImage(el) {
  return `<div class="pimg" style="height:${+el.height || 140}px">${esc(el.label || 'Image')}</div>`;
}

function protoTabs(el, key) {
  const tabs = arr(el.tabs);
  const i = Math.min(S.tabsel[key] || 0, Math.max(0, tabs.length - 1));
  const cur = tabs[i] || {};
  const buttons = tabs.map((tb, j) => `<button class="ptab ${j === i ? 'on' : ''}" type="button" data-act="ptab" data-key="${esc(key)}" data-i="${j}">${esc(tb.label || `Tab ${j + 1}`)}</button>`).join('');
  return `<div class="ptabs">${buttons}</div><div class="ptabc">${renderEls(cur.elements)}</div>`;
}

function protoChart(el) {
  const vals = arr(el.values).length ? arr(el.values).map(Number) : [4, 6, 3, 7, 5, 8, 6];
  const max = Math.max(1, ...vals);
  const bars = vals.map((v) => `<span style="height:${Math.max(4, (v / max) * 100)}%" title="${esc(v)}"></span>`).join('');
  return `<div class="pchart"><div class="ct">${inl(el.label || el.title || 'Chart')}</div><div class="bars">${bars}</div></div>`;
}

function protoTerminalLine(l) {
  return String(l).startsWith('$ ') ? `<span class="pr">$</span> ${esc(String(l).slice(2))}` : esc(l);
}

function protoTerminal(el) {
  return `<pre class="term">${arr(el.lines).map(protoTerminalLine).join('\n')}</pre>`;
}

function protoCode(el) {
  return `<pre class="pcode">${esc(el.code || el.text || '')}</pre>`;
}

function protoDivider() {
  return '<hr style="border:0;border-top:1px solid var(--line);margin:4px 0">';
}

function protoBadge(el) {
  return `<span class="badge ${esc(el.tone || '')}">${esc(el.label || el.text || '')}</span>`;
}

function protoProgress(el) {
  const v = Math.max(0, Math.min(100, +el.value || 0));
  return `<div class="pprog"><div class="fld"><span class="lbl">${inl(el.label || '')} · ${v}%</span></div><div class="bar"><span style="width:${v}%"></span></div></div>`;
}

function protoEmpty(el) {
  return `<div class="pempty"><div class="ei">${esc(el.icon || '∅')}</div><div>${inl(el.text || el.label || 'Nothing here yet')}</div>${renderEls(el.elements)}</div>`;
}

function protoUnknown(el, key, t) {
  return `<div class="pph">Unknown element type "${esc(t)}"${el.label ? `: ${esc(el.label)}` : ''}</div>`;
}

const PROTO_ELEMENTS = new Map([
  ['heading', protoHeading], ['text', protoText], ['input', protoInput], ['search', protoInput], ['textarea', protoTextarea],
  ['select', protoSelect], ['checkbox', protoCheckbox], ['toggle', protoCheckbox], ['radio', protoRadio], ['upload', protoUpload],
  ['button', protoButton], ['link', protoLink], ['table', protoTable], ['list', protoList], ['card', protoCard], ['section', protoCard],
  ['row', protoRow], ['stat', protoStat], ['alert', protoAlert], ['image', protoImage], ['tabs', protoTabs], ['chart', protoChart],
  ['terminal', protoTerminal], ['code', protoCode], ['divider', protoDivider], ['badge', protoBadge], ['progress', protoProgress],
  ['empty', protoEmpty],
]);

function elInner(el, key, t) {
  const render = PROTO_ELEMENTS.get(t) || protoUnknown;
  return render(el, key, t);
}

function screenItem(x, isModal) {
  const key = 'screen:' + x.id;
  const refs = A.deepRefs.get(key) || new Set();
  const on = isModal ? S.modal === x.id : S.screen === x.id && !S.modal;
  return `<button class="sitem ${on ? 'on' : ''} ${nodeIsHl(key) ? 'hl' : ''}" data-act="${isModal ? 'open' : 'goto'}" data-id="${esc(x.id)}">` +
    `<span>${esc(x.title || x.id)}${changeBadge(key)}</span><span class="dot ${refs.size ? 'ok' : 'none'}" title="${refs.size} requirement links"></span></button>`;
}

function navActive(n) {
  const sid = String(n.goto || '').split('#')[0];
  if (sid === S.screen) return true;
  const s = screenById(S.screen);
  return !!(s && s.nav_parent === sid);
}

function modalView() {
  const m = screenById(S.modal);
  if (!m) return '';
  return `<div class="mback" data-act="modal-bg"><div class="modal" data-act="noop">` +
    `<div class="mh"><span>${esc(m.title || m.id)}</span><button class="x" type="button" data-act="close-modal" title="Close">×</button></div>` +
    `<div class="mb">${m.description && S.xray ? `<div class="statebanner">${mdx(m.description)}</div>` : ''}${renderEls(m.elements)}</div></div></div>`;
}

function screenNotes(s, st) {
  const key = 'screen:' + s.id;
  const deep = A.deepRefs.get(key) || new Set();
  const m = S.modal ? screenById(S.modal) : null;
  return `<div class="snotes"><div class="snh"><button class="linkish" data-act="sel-node" data-key="${esc(key)}">▭ ${esc(s.title || s.id)}</button>${changeBadge(key, true)}` +
    `<span class="muted small">satisfies</span>${chips(s.satisfies) || '<span class="faint small">nothing at screen level</span>'}${codeRefs(key)}` +
    `<span class="muted small" style="margin-left:auto">${deep.size} requirement/AC links incl. elements</span></div>` +
    (s.description ? `<div class="md">${mdx(s.description)}</div>` : '') +
    (st && st.description ? `<div class="md"><b>State "${esc(st.label || st.id)}":</b> ${inl(st.description)}</div>` : '') +
    (m ? `<div class="md"><b>Dialog "${esc(m.title || m.id)}":</b> ${m.description ? inl(m.description) : ''} ${chips(m.satisfies)}</div>` : '') +
    '</div>';
}

function themeStyle() {
  return Object.entries(A.theme.vars).map(([k, v]) => `${k}:${String(v).replace(/[;{}<>]/g, '')}`).join(';');
}

function themeChip() {
  const t = A.theme;
  const label = t.explicit ? `Theme: ${t.preset}${A.nodeByKey.has('theme') && A.nodeByKey.get('theme').satisfies.length ? ' · traced' : ''}` : 'Theme: SV default';
  const act = A.nodeByKey.has('theme') ? 'data-act="sel-node" data-key="theme"' : 'data-act="tab" data-id="overview"';
  return `<button class="ghost sm themechip" ${act} title="Prototype styling"><i style="background:${esc(t.tokens.background)}"></i><i style="background:${esc(t.tokens.primary)}"></i>${esc(label)}</button>`;
}

function protoCurrentScreen(screens) {
  const s = screenById(S.screen);
  if (s && !s.modal) return s;
  return screens.find((x) => !x.modal) || screens[0];
}

function protoScreenGroup([g, list]) {
  return `${g ? `<div class="sgrp">${esc(g)}</div>` : ''}${list.map((x) => screenItem(x)).join('')}`;
}

const isRemovedScreen = (x) => changeOf('screen:' + x.id) === 'removed';

function protoRemovedGroup(screens) {
  const removed = screens.filter(isRemovedScreen);
  return removed.length ? `<div class="sgrp">Removed</div>${removed.map((x) => screenItem(x, !!x.modal)).join('')}` : '';
}

function protoSidebar(screens) {
  const kept = screens.filter((x) => !isRemovedScreen(x));
  const pages = kept.filter((x) => !x.modal);
  const modals = kept.filter((x) => x.modal);
  const groups = groupBy(pages, (x) => x.group || x.role || '');
  const dialogs = modals.length ? `<div class="sgrp">Dialogs</div>${modals.map((x) => screenItem(x, true)).join('')}` : '';
  return `<aside class="slist" data-scroll="slist">${[...groups].map(protoScreenGroup).join('')}${dialogs}${protoRemovedGroup(screens)}</aside>`;
}

function protoStatePill(x, i) {
  const id = RC.stateIdOf(x, i);
  return `<button class="pill ${S.screenState === id ? 'on' : ''}" data-act="state" data-id="${esc(id)}">${esc(x.label || id)}</button>`;
}

function protoStatePills(states, st) {
  if (!states.length) return '';
  return `<span class="pills"><button class="pill ${st ? '' : 'on'}" data-act="state" data-id="">Default</button>${states.map(protoStatePill).join('')}</span>`;
}

function protoStageHint() {
  if (S.xray) return `Inspect: click any element to see what it satisfies${isReview() ? ' and comment on it' : ''}`;
  const comment = isReview() ? ' and comment' : '';
  return `Click through like a real app · <b>X</b> or Alt+click to inspect${comment}${A.changes.used ? ' · <b>C</b> for changes' : ''}`;
}

function changesToggle() {
  if (!A.changes.used) return '';
  return `<button class="ghost sm chgbtn ${S.changeView ? 'on' : ''}" type="button" data-act="changes" title="Outline what the change adds, changes and removes (C)">Changes</button>`;
}

function protoStageBar(s, states, st) {
  return `<div class="stagebar"><button class="ghost" type="button" data-act="back" ${S.history.length ? '' : 'disabled'}>← Back</button>` +
    `<span class="crumb">${esc(s.title || s.id)}</span>${s.role ? `<span class="tag">${esc(s.role)}</span>` : ''}` +
    protoStatePills(states, st) +
    `${themeChip()}${changesToggle()}<span class="hint">${protoStageHint()}</span></div>`;
}

function protoNavItems(nav, cls) {
  return nav.map((n) => `<button class="${cls} ${navActive(n) ? 'on' : ''}" type="button" data-act="goto" data-id="${esc(n.goto)}">${esc(n.label)}</button>`).join('');
}

function protoAppName() {
  return `<span class="appname">${esc((P.prototype || {}).app_name || P.title || '')}</span>`;
}

function protoScreenNav(s) {
  const nav = arr(P.nav);
  return s.layout === 'plain' ? [] : nav;
}

function protoAppNav(s) {
  const nav = protoScreenNav(s);
  return nav.length ? `<div class="appnav">${protoAppName()}${protoNavItems(nav, 'navi')}</div>` : '';
}

// On a phone the app name is a slim top bar and the nav is a bottom tab bar.
function protoMobileBars(s) {
  const nav = protoScreenNav(s);
  if (!nav.length) return { top: '', bottom: '' };
  return { top: `<div class="appbar">${protoAppName()}</div>`, bottom: `<nav class="tabbar">${protoNavItems(nav, 'tabi')}</nav>` };
}

function protoBars(s, device) {
  return device === 'mobile' ? protoMobileBars(s) : { top: protoAppNav(s), bottom: '' };
}

function protoStateBanner(st) {
  const descriptionOnly = st && !st.elements && st.description;
  return descriptionOnly ? `<div class="statebanner">${inl(st.description)}</div>` : '';
}

function protoDevice(s, st) {
  const device = s.device || (P.prototype || {}).device || 'desktop';
  const els = st && st.elements ? st.elements : s.elements;
  const bars = protoBars(s, device);
  return `<div class="device ${esc(device)} ${S.xray ? 'xray' : ''} pv-${esc(A.theme.preset)}${S.changeView ? ' changes' : ''}" style="${esc(themeStyle())}">${bars.top}` +
    `<div class="sbody">${protoStateBanner(st)}${renderEls(els)}</div>${bars.bottom}${S.modal ? modalView() : ''}</div>`;
}

function prototypeView() {
  const screens = arr(P.screens);
  const s = protoCurrentScreen(screens);
  if (!s) return '<div class="empty">This plan has no screens.</div>';
  S.screen = s.id;
  const states = arr(s.states);
  const st = states.find((x, i) => RC.stateIdOf(x, i) === S.screenState) || null;
  return `<div class="proto">${protoSidebar(screens)}<section class="stage" data-scroll="stage">${protoStageBar(s, states, st)}` +
    `${protoDevice(s, st)}${screenNotes(s, st)}</section></div>`;
}

</script>
<script>/* viewer-system.js */
/* reqplan viewer - System tab: interfaces (HTTP/event/CLI/job), flows (sequence/state/process), data model, architecture. */
'use strict';

function systemSubs() {
  const s = [];
  if (arr(P.interfaces || P.api).length) s.push(['interfaces', 'Interfaces', arr(P.interfaces || P.api).length]);
  if (arr(P.flows).length) s.push(['flows', 'Flows', arr(P.flows).length]);
  if (arr(P.entities).length) s.push(['data', 'Data', arr(P.entities).length]);
  if (arr(P.components).length) s.push(['architecture', 'Architecture', arr(P.components).length]);
  return s;
}

// Filters the master lists (interfaces, flows); the data and architecture graphs always show every item.
function changeFilterBar() {
  if (!A.changes.used || !['interfaces', 'flows'].includes(S.sub)) return '';
  const on = S.changeFilter === 'changes';
  return `<span class="seg chgseg">${segButton('chgfilter', 'all', 'All', !on)}${segButton('chgfilter', 'changes', 'Changes only', on)}</span>`;
}

function systemView() {
  const subs = systemSubs();
  if (!subs.length) return '<div class="empty">No system views in this plan.</div>';
  if (!subs.find((x) => x[0] === S.sub)) S.sub = subs[0][0];
  const bar = `<div class="subtabs">${subs.map(([id, l, n]) => `<button class="stab ${S.sub === id ? 'on' : ''}" data-act="sub" data-id="${id}">${l} <span class="${S.sub === id ? '' : 'muted'}">${n}</span></button>`).join('')}${changeFilterBar()}</div>`;
  const body = { interfaces: interfacesView, flows: flowsView, data: dataView, architecture: archView }[S.sub]();
  return `<div class="page wide">${bar}${body}</div>`;
}

function masterItem(sub, x, cur, labelFn) {
  return `<button class="mitem ${x === cur ? 'on' : ''} ${nodeIsHl(x.__key) ? 'hl' : ''}" data-act="syssel" data-sub="${sub}" data-id="${esc(x.id)}">${labelFn(x)}${changeBadge(x.__key)}</button>`;
}

function masterDetail(sub, all, labelFn, groupFn, detailFn) {
  const list = all.filter((x) => !isHiddenUnchanged(x.__key));
  const cur = list.find((x) => String(x.id) === String(S.sysSel[sub])) || list[0];
  S.sysSel[sub] = cur && cur.id;
  const groups = groupBy(list, groupFn || (() => ''));
  const side = `<aside class="mlist" data-scroll="ml-${sub}">${[...groups].map(([g, items]) => `${g ? `<div class="sgrp">${esc(g)}</div>` : ''}` +
    items.map((x) => masterItem(sub, x, cur, labelFn)).join('')).join('')}</aside>`;
  return `<div class="md2">${side}<section class="mdetail">${cur ? detailFn(cur) : ''}</section></div>`;
}

function detailHead(key, title, extra) {
  const n = A.nodeByKey.get(key);
  const own = n ? n.satisfies : [];
  const deep = [...(A.deepRefs.get(key) || new Set())].filter((r) => !own.includes(r));
  const refs = own.length
    ? `<span class="muted small">satisfies </span>${chips(own)}${deep.length ? ` <span class="muted small">· through its parts </span>${chips(deep)}` : ''}`
    : deep.length ? `<span class="muted small">satisfies through its parts </span>${chips(deep)}` : untracedNote(key);
  return `<div class="card ${isSel(key) ? 'sel' : ''} ${nodeIsHl(key) ? 'hl' : ''}"><div class="dh"><div>${title}${changeBadge(key, true)}${commentMark(key)}</div><button class="ghost sm" data-act="sel-node" data-key="${esc(key)}">${inspectLabel()}</button></div>` +
    (extra || '') + `<div style="margin-top:6px">${refs}${codeRefs(key)}</div></div>`;
}

function untracedNote(key) {
  return changeOf(key) === 'existing' ? '<span class="faint small">existing, unchanged: not traced</span>' : '<span class="notr">not traced to any requirement</span>';
}

// ───────── interfaces ─────────

function ifaceBadge(x) {
  const k = RC.interfaceKind(x);
  const t = k === 'http' ? String(x.method || 'GET').toUpperCase() : { event: 'EVT', cli: 'CLI', job: 'JOB', rpc: 'RPC' }[k] || k.slice(0, 3).toUpperCase();
  return `<span class="meth ${esc(t)}">${esc(t)}</span>`;
}

const IFACE_KNOWN = new Set(['id', 'kind', 'method', 'path', 'summary', 'description', 'auth', 'params', 'request', 'responses', 'response', 'satisfies', 'group',
  'topic', 'channel', 'producer', 'consumers', 'delivery', 'payload', 'command', 'usage', 'options', 'examples', 'schedule', 'trigger', 'inputs', 'outputs',
  'steps', 'on_failure', 'name', 'title', 'latency', 'change', 'code_ref']);

function interfacesView() {
  const list = arr(P.interfaces || P.api);
  return masterDetail('interfaces', list,
    (x) => `${ifaceBadge(x)} <span class="mono">${esc(trunc(RC.interfaceKind(x) === 'http' ? x.path || '' : RC.interfaceLabel(x), 34))}</span>`,
    (x) => x.group || IFACE_LABEL[RC.interfaceKind(x)] || RC.interfaceKind(x),
    ifaceDetail);
}

function kvRows(rows) {
  const r = rows.filter((x) => x[1] != null && x[1] !== '' && !(Array.isArray(x[1]) && !x[1].length));
  return r.length ? `<dl class="kv">${r.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${typeof v === 'string' ? inl(v) : Array.isArray(v) ? v.map((x) => `<code>${esc(typeof x === 'string' ? x : JSON.stringify(x))}</code>`).join(' ') : `<code>${esc(JSON.stringify(v))}</code>`}</dd>`).join('')}</dl>` : '';
}

function paramsTable(params) {
  const p = arr(params);
  if (!p.length) return '';
  const cols = ['name', 'in', 'type', 'required', 'description'].filter((c) => p.some((x) => x[c] != null));
  return `<h3>Parameters</h3><table class="tbl"><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr>${p.map((x) => `<tr>${cols.map((c) => `<td>${c === 'name' ? `<code>${esc(x[c])}</code>` : c === 'required' ? (x[c] ? 'yes' : '') : inl(x[c] == null ? '' : String(x[c]))}</td>`).join('')}</tr>`).join('')}</table>`;
}

function jsonSection(title, value) {
  return value != null ? `<h3>${title}</h3><pre class="json">${jsonHl(value)}</pre>` : '';
}

function ifaceIntro(x) {
  const summary = x.summary ? `<div style="margin-top:6px">${inl(x.summary)}</div>` : '';
  return summary + (x.description ? `<div class="md muted">${mdx(x.description)}</div>` : '');
}

function httpResponseMap(x) {
  if (x.responses) return x.responses;
  return x.response != null ? { 200: x.response } : {};
}

function httpResponseBody(r) {
  const isWrapped = r && typeof r === 'object' && ('body' in r || 'description' in r);
  return isWrapped ? r : { body: r };
}

function httpConsole(x, code, body) {
  const data = x.request != null ? ` -d '${esc(JSON.stringify(x.request))}'` : '';
  const out = body.body !== undefined ? JSON.stringify(body.body, null, 2) : '';
  return `<pre class="term console">$ curl -X ${esc(String(x.method || 'GET').toUpperCase())} ${esc(x.path || '')}${data}\n\n<span class="pr">HTTP ${esc(code)}</span> (${esc(x.latency || '~120 ms')})\n${esc(out)}</pre>`;
}

function httpResponses(x, key, sim) {
  const responses = httpResponseMap(x);
  const codes = Object.keys(responses);
  if (!codes.length) return '';
  const code = codes.includes(String(sim.code)) ? String(sim.code) : codes[0];
  const body = httpResponseBody(responses[code]);
  const tabs = codes.map((c) => `<button class="rtab c${String(c)[0]} ${c === code ? 'on' : ''}" data-act="sim" data-key="${esc(key)}" data-k="code" data-v="${esc(c)}">${esc(c)}</button>`).join('');
  const description = body.description ? `<div class="muted">${inl(body.description)}</div>` : '';
  const shown = body.body !== undefined ? `<pre class="json">${jsonHl(body.body)}</pre>` : '';
  return `<h3>Responses</h3><div class="rtabs">${tabs}</div>${description}${shown}` +
    `<div class="btnrow"><button class="ghost" data-act="sim" data-key="${esc(key)}" data-k="sent" data-v="1">▶ Simulate request (${esc(code)})</button></div>` +
    (sim.sent ? httpConsole(x, code, body) : '');
}

function ifaceHttp(x, key, sim) {
  return kvRows([['Auth', x.auth], ['Latency budget', x.latency]]) + paramsTable(x.params) +
    jsonSection('Request body', x.request) + httpResponses(x, key, sim);
}

function eventNodes(x, consumers) {
  const prod = x.producer ? [{ id: 'p', label: String(x.producer), sub: 'producer', shape: 'round' }] : [];
  const topic = { id: 't', label: String(x.topic || x.channel || x.id), sub: 'topic', shape: 'pill', cls: 'cur' };
  return [...prod, topic, ...consumers.map((c, i) => ({ id: 'c' + i, label: String(c), sub: 'consumer', shape: 'round' }))];
}

function eventEdges(x, consumers) {
  const publish = x.producer ? [{ from: 'p', to: 't', label: 'publish' }] : [];
  return [...publish, ...consumers.map((c, i) => ({ from: 't', to: 'c' + i, label: 'subscribe' }))];
}

function ifaceEvent(x, key) {
  const consumers = arr(x.consumers);
  return kvRows([['Topic', x.topic || x.channel], ['Producer', x.producer], ['Consumers', consumers], ['Delivery', x.delivery]]) +
    svgGraph(eventNodes(x, consumers), eventEdges(x, consumers), { id: key, w: 170, gx: 90 }) +
    jsonSection('Payload', x.payload);
}

function cliOptions(opts) {
  if (!opts.length) return '';
  const rows = opts.map((o) => `<tr><td><code>${esc(o.flag || o.name)}</code></td><td>${inl(o.description || '')}</td><td>${esc(o.default == null ? '' : o.default)}</td></tr>`).join('');
  return `<h3>Options</h3><table class="tbl"><tr><th>Option</th><th>Description</th><th>Default</th></tr>${rows}</table>`;
}

function cliExample(ex, i, key, sim) {
  const e = typeof ex === 'string' ? { command: ex } : ex;
  const shown = sim['ex' + i];
  const output = arr(e.output);
  const printed = shown ? '\n' + output.map((l) => esc(l)).join('\n') : '';
  const run = output.length ? `<div class="btnrow"><button class="ghost sm" data-act="sim" data-key="${esc(key)}" data-k="ex${i}" data-v="1">${shown ? 'Hide output' : '▶ Run example'}</button></div>` : '';
  return `<h3>${esc(e.title || `Example ${i + 1}`)}</h3><pre class="term">$ ${esc(e.command || '')}${printed}</pre>` + run;
}

function ifaceCli(x, key, sim) {
  return kvRows([['Usage', x.usage]]) + cliOptions(arr(x.options)) +
    arr(x.examples).map((ex, i) => cliExample(ex, i, key, sim)).join('');
}

function jobStepStyle(j, i) {
  if (j <= i) return 'color:var(--ok);font-weight:600';
  return j === i + 1 && i >= 0 ? '' : 'color:var(--ink2)';
}

function jobRunLabel(i, count) {
  if (i + 1 >= count) return '↺ Reset';
  return i < 0 ? '▶ Run job' : '▶ Next step';
}

function jobRun(steps, key, sim) {
  if (!steps.length) return '';
  const i = sim.i == null ? -1 : sim.i;
  const items = steps.map((s, j) => `<li style="${jobStepStyle(j, i)}">${j <= i ? '✓ ' : ''}${inl(typeof s === 'string' ? s : s.label || '')}</li>`).join('');
  return `<h3>Run</h3><ol>${items}</ol>` +
    `<div class="btnrow"><button class="ghost" data-act="sim" data-key="${esc(key)}" data-k="i" data-v="${i + 1 >= steps.length ? -1 : i + 1}">${jobRunLabel(i, steps.length)}</button></div>`;
}

function ifaceJob(x, key, sim) {
  return kvRows([['Schedule', x.schedule], ['Trigger', x.trigger], ['Inputs', arr(x.inputs)], ['Outputs', arr(x.outputs)], ['On failure', x.on_failure]]) +
    jobRun(arr(x.steps), key, sim);
}

function ifaceGeneric(x) {
  return jsonSection('Request', x.request) + jsonSection('Response', x.response);
}

function ifaceExtras(x) {
  const extra = Object.keys(x).filter((kk) => !IFACE_KNOWN.has(kk));
  return extra.length ? `<h3>Details</h3>${kvRows(extra.map((kk) => [kk, x[kk]]))}` : '';
}

const IFACE_SECTIONS = new Map([['http', ifaceHttp], ['event', ifaceEvent], ['cli', ifaceCli], ['job', ifaceJob]]);

function ifaceDetail(x) {
  const key = x.__key;
  const sim = simState(key);
  const section = IFACE_SECTIONS.get(RC.interfaceKind(x)) || ifaceGeneric;
  return detailHead(key, `${ifaceBadge(x)} <span class="mono big">${esc(RC.interfaceLabel(x))}</span>`, ifaceIntro(x)) +
    section(x, key, sim) + ifaceExtras(x);
}

// ───────── flows ─────────

function flowsView() {
  return masterDetail('flows', arr(P.flows), (f) => `<span>${ICON.flow}</span> ${esc(f.title || f.id)} <span class="badge" style="margin-left:auto">${esc(RC.flowKind(f))}</span>`, null, flowDetail);
}

function flowDetail(f) {
  const kind = RC.flowKind(f);
  const key = f.__key;
  let html = detailHead(key, `<span class="kind">${esc(kind)} flow</span><div class="big">${esc(f.title || f.id)}</div>`, f.description ? `<div class="md muted">${mdx(f.description)}</div>` : '');
  if (kind === 'sequence') html += sequenceSection(f, key);
  else if (kind === 'state') html += stateSection(f, key);
  else html += processSection(f, key);
  return html;
}

function stepRow(k, label, refs, extra) {
  return `<tr class="clk ${isSel(k) ? 'on' : ''}" data-act="sel-node" data-key="${esc(k)}"><td>${label}${commentMark(k)}</td><td>${extra || ''}</td><td>${chips(refs) || '<span class="faint small">—</span>'}</td></tr>`;
}

function sequenceSection(f, key) {
  const steps = arr(f.steps || f.messages);
  const sim = S.sim[key] || (S.sim[key] = { i: -1 });
  const i = sim.i;
  const cur = steps[i];
  return `<div class="sim"><button class="ghost sm" data-act="sim" data-key="${esc(key)}" data-k="i" data-v="-1">⏮</button>` +
    `<button class="ghost sm" data-act="sim" data-key="${esc(key)}" data-k="i" data-v="${Math.max(-1, i - 1)}">◀</button>` +
    `<button class="ghost sm" data-act="sim" data-key="${esc(key)}" data-k="i" data-v="${Math.min(steps.length - 1, i + 1)}">▶ Step</button>` +
    `<span>${i < 0 ? 'Showing all steps — press ▶ to walk through' : `Step ${i + 1}/${steps.length}: <span class="cur">${esc(cur.from)} → ${esc(cur.to)}</span> ${inl(cur.label || cur.message || '')}`}</span></div>` +
    seqSvg(f, i, key) +
    `<table class="tbl"><tr><th>Step</th><th>Notes</th><th>Satisfies</th></tr>${steps.map((m, j) => stepRow(`${key}/m${j + 1}`, `${j + 1}. <b>${esc(m.from)} → ${esc(m.to)}</b> ${inl(m.label || m.message || '')}`, m.satisfies, m.note ? inl(m.note) : '')).join('')}</table>`;
}

function reqHlClass(refs) {
  return S.hlReq && touches(arr(refs), S.hlReq) ? 'hl' : '';
}

function simButton(key, k, v, label) {
  return `<button class="ghost sm" data-act="sim" data-key="${esc(key)}" data-k="${k}" data-v="${v}">${label}</button>`;
}

function simResetButton(key, k, v) {
  return `<button class="ghost sm" data-act="sim" data-key="${esc(key)}" data-k="${k}" data-v="${v}" style="margin-left:auto">↺ Reset</button>`;
}

function stateList(f) {
  return arr(f.states).map((s, i) => (typeof s === 'string' ? { id: s } : Object.assign({}, s, { id: RC.stateIdOf(s, i) })));
}

function stateSub(s, ctx) {
  if (s.id === ctx.initial) return 'initial';
  return ctx.finals.has(s.id) || s.final ? 'final' : '';
}

function stateNode(s, ctx) {
  return {
    id: s.id, label: s.label || s.id, sub: stateSub(s, ctx), shape: 'round',
    cls: [s.id === ctx.cur ? 'cur' : '', reqHlClass(s.satisfies)].join(' '),
    key: s.satisfies ? `${ctx.key}/s:${s.id}` : null, title: s.description || s.label || s.id,
  };
}

function transitionEdge(t, i, ctx) {
  const k = `${ctx.key}/t${i + 1}`;
  return { from: t.from, to: t.to, label: `${t.on || ''}${t.guard ? ` [${t.guard}]` : ''}`, key: k, title: arr(t.satisfies).join(', '),
    cls: [isSel(k) ? 'sel' : '', t.from === ctx.cur ? 'on' : '', reqHlClass(t.satisfies)].join(' ') };
}

function fireButton(t, i, key) {
  const guard = t.guard ? ` <span class="faint">[${esc(t.guard)}]</span>` : '';
  return `<button class="ghost sm" data-act="fire" data-key="${esc(key)}" data-i="${i}">${esc(t.on || `→ ${t.to}`)}${guard}</button>`;
}

function stateSimBar(transitions, ctx) {
  const avail = transitions.map((t, i) => [t, i]).filter(([t]) => t.from === ctx.cur);
  const buttons = avail.length ? avail.map(([t, i]) => fireButton(t, i, ctx.key)).join('') : '<span class="faint">no outgoing transitions (final)</span>';
  return `<div class="sim"><span>Simulate · current state: <span class="cur">${esc(ctx.cur)}</span></span>${buttons}` +
    `${simResetButton(ctx.key, 'reset', '1')}</div>`;
}

function transitionRow(t, i, key) {
  const label = `<b>${esc(t.from)}</b> → <b>${esc(t.to)}</b> ${t.on ? `on <code>${esc(t.on)}</code>` : ''}`;
  return stepRow(`${key}/t${i + 1}`, label, t.satisfies, `${t.guard ? `[${inl(t.guard)}] ` : ''}${t.effect ? inl(t.effect) : ''}`);
}

function stateDescriptions(states) {
  if (!states.some((s) => s.description)) return '';
  return `<h3>States</h3><dl class="kv">${states.map((s) => `<dt>${esc(s.label || s.id)}</dt><dd>${inl(s.description || '')} ${chips(s.satisfies)}</dd>`).join('')}</dl>`;
}

function stateSection(f, key) {
  const states = stateList(f);
  const transitions = arr(f.transitions);
  const sim = simState(key);
  const initial = f.initial || (states[0] && states[0].id);
  const ctx = { key, initial, cur: sim.cur || initial, finals: new Set(arr(f.final)) };
  const trail = sim.trail || [initial];
  const nodes = states.map((s) => stateNode(s, ctx));
  const edges = transitions.map((t, i) => transitionEdge(t, i, ctx));
  return stateSimBar(transitions, ctx) +
    `<div class="trail" style="margin:6px 2px">${trail.map(esc).join(' → ')}</div>` +
    svgGraph(nodes, edges, { id: key, start: initial, w: 140, gx: 110 }) +
    `<table class="tbl"><tr><th>Transition</th><th>Guard / effect</th><th>Satisfies</th></tr>${transitions.map((t, i) => transitionRow(t, i, key)).join('')}</table>` +
    stateDescriptions(states);
}

function processSteps(f, key) {
  return arr(f.steps).map((s, i) => {
    const id = String(s.id || `s${i + 1}`);
    return Object.assign({}, s, { id, __k: `${key}/${id}` });
  });
}

const PROCESS_SHAPES = new Map([['decision', 'diamond'], ['start', 'pill'], ['end', 'pill']]);

function processNode(s, ctx) {
  return {
    id: s.id, label: s.label || s.id, sub: s.actor || '', key: s.__k, title: s.description || s.label,
    shape: PROCESS_SHAPES.get(s.kind) || 'rect',
    cls: [s.id === ctx.cur ? 'cur' : '', isSel(s.__k) ? 'sel' : '', s.kind || '', reqHlClass(s.satisfies)].join(' '),
  };
}

function processEdge(s, n, cur) {
  const isName = typeof n === 'string';
  return { from: s.id, to: String(isName ? n : n.to), label: isName ? '' : n.label || '', cls: s.id === cur ? 'on' : '' };
}

function processEdges(steps, cur) {
  const edges = [];
  steps.forEach((s) => arr(s.next).forEach((n) => edges.push(processEdge(s, n, cur))));
  return edges;
}

function processNextButton(n, steps, key) {
  const target = (steps.find((s) => s.id === String(n.to)) || {}).label || n.to;
  return simButton(key, 'cur', esc(n.to), `${esc(n.label || 'next')} → ${esc(target)}`);
}

function processSimBar(steps, curStep, ctx) {
  const nexts = arr(curStep.next).map((n) => (typeof n === 'string' ? { to: n, label: '' } : n));
  const buttons = nexts.length ? nexts.map((n) => processNextButton(n, steps, ctx.key)).join('') : '<span class="faint">end of flow</span>';
  return `<div class="sim"><span>Walk through · at: <span class="cur">${esc(curStep.label || ctx.cur || '')}</span></span>${buttons}` +
    `${simResetButton(ctx.key, 'cur', '')}</div>`;
}

function processRow(s) {
  const actor = s.actor ? ` <span class="tag">${esc(s.actor)}</span>` : '';
  return stepRow(s.__k, `<b>${esc(s.label || s.id)}</b>${actor}`, s.satisfies, inl(s.description || ''));
}

function processSection(f, key) {
  const steps = processSteps(f, key);
  const sim = simState(key);
  const first = (steps.find((s) => s.kind === 'start') || steps[0] || {}).id;
  const ctx = { key, cur: sim.cur || first };
  const curStep = steps.find((s) => s.id === ctx.cur) || {};
  const nodes = steps.map((s) => processNode(s, ctx));
  const edges = processEdges(steps, ctx.cur);
  return processSimBar(steps, curStep, ctx) +
    (curStep.description ? `<div class="md" style="margin:6px 2px">${mdx(curStep.description)}</div>` : '') +
    svgGraph(nodes, edges, { id: key, start: first, w: 150, gx: 80 }) +
    `<table class="tbl"><tr><th>Step</th><th>Description</th><th>Satisfies</th></tr>${steps.map(processRow).join('')}</table>`;
}

// ───────── data & architecture ─────────

// Graph node classes: selection, highlight, untraced, plus the item's change in existing-project mode.
function graphNodeClass(key) {
  const cls = [isSel(key) ? 'sel' : '', nodeIsHl(key) ? 'hl' : '', A.untracedKeys.includes(key) ? 'untraced' : ''].join(' ');
  return changeOf(key) ? `${cls} chg-${changeOf(key)}` : cls;
}

function dataView() {
  const ents = arr(P.entities);
  const nodes = ents.map((e) => ({ id: String(e.id || e.name), label: e.name || e.id, sub: `${arr(e.fields).length} fields`, key: e.__key, cls: graphNodeClass(e.__key) }));
  const edges = [];
  ents.forEach((e) => arr(e.relations).forEach((r) => edges.push({ from: String(e.id || e.name), to: String(r.to), label: [r.cardinality, r.label].filter(Boolean).join(' ') })));
  return svgGraph(nodes, edges, { id: 'data', w: 150, gx: 110 }) + `<div class="grid2">${ents.map(entityCard).join('')}</div>`;
}

function fieldRow(key, fl) {
  const k = `${key}/${fl.name}`;
  return `<tr class="clk ${isSel(k) ? 'on' : ''}" data-act="sel-node" data-key="${esc(k)}"><td>${esc(fl.name)}${fl.required ? '<b class="req">*</b>' : ''}${fl.change ? changeBadge(k) : ''}${commentMark(k)}</td><td class="mono small">${esc(fl.type || '')}${fl.pii ? ' <span class="badge warn">PII</span>' : ''}</td><td>${chips(fl.satisfies)}${fl.description ? `<div class="small muted">${inl(fl.description)}</div>` : ''}</td></tr>`;
}

function entityCard(e) {
  const key = e.__key;
  return `<div class="card ${isSel(key) ? 'sel' : ''} ${nodeIsHl(key) ? 'hl' : ''}" id="card-${esc(key)}"><div class="ch"><span class="kind">▦ Entity</span><b class="grow">${esc(e.name || e.id)}${changeBadge(key, true)}${commentMark(key)}</b>` +
    `<button class="ghost sm" data-act="sel-node" data-key="${esc(key)}">${inspectLabel()}</button></div>${e.description ? `<div class="md muted small">${mdx(e.description)}</div>` : ''}` +
    `<div>${chips(e.satisfies)}${codeRefs(key)}</div><table class="tbl fields"><tr><th>Field</th><th>Type</th><th></th></tr>${arr(e.fields).map((fl) => fieldRow(key, fl)).join('')}</table>` +
    `${arr(e.relations).length ? `<div class="small muted" style="margin-top:6px">${arr(e.relations).map((r) => `→ ${esc(r.to)} ${esc(r.cardinality || '')} ${esc(r.label || '')}`).join('<br>')}</div>` : ''}</div>`;
}

const ARCH_SHAPES = new Map([['external', 'pill'], ['database', 'round'], ['db', 'round'], ['queue', 'round']]);

function archNode(c) {
  return { id: String(c.id), label: c.name || c.id, sub: [c.kind, c.tech].filter(Boolean).join(' · '), key: c.__key, shape: ARCH_SHAPES.get(c.kind) || 'rect', cls: graphNodeClass(c.__key) };
}

function archEdge(c, d) {
  const isName = typeof d === 'string';
  return { from: String(c.id), to: String(isName ? d : d.to), label: isName ? '' : d.label || '' };
}

function archCard(c) {
  const key = c.__key;
  const tech = c.tech ? `<div class="small muted">${esc(c.tech)}</div>` : '';
  const description = c.description ? `<div class="md">${mdx(c.description)}</div>` : '';
  return `<div class="card ${isSel(key) ? 'sel' : ''} ${nodeIsHl(key) ? 'hl' : ''}" id="card-${esc(key)}"><div class="ch"><span class="kind">⬡ ${esc(c.kind || 'component')}</span><b class="grow">${esc(c.name || c.id)}${changeBadge(key, true)}${commentMark(key)}</b>` +
    `<button class="ghost sm" data-act="sel-node" data-key="${esc(key)}">${inspectLabel()}</button></div>${tech}${description}<div>${chips(c.satisfies)}${codeRefs(key)}</div></div>`;
}

function archView() {
  const comps = arr(P.components);
  const nodes = comps.map(archNode);
  const edges = [];
  comps.forEach((c) => arr(c.depends_on).forEach((d) => edges.push(archEdge(c, d))));
  return svgGraph(nodes, edges, { id: 'arch', w: 160, gx: 100 }) + `<div class="grid2">${comps.map(archCard).join('')}</div>`;
}

</script>
<script>/* viewer-panels.js */
/* reqplan viewer - Overview, Decisions, Delivery, Traceability, Review tabs and the right-hand inspector. */
'use strict';

// ───────── overview ─────────

const PANEL_COUNT_STATS = [
  { key: 'screens', label: 'Screens', sub: 'clickable prototype', tab: 'prototype' },
  { key: 'interfaces', label: 'Interfaces', sub: 'APIs · events · CLI · jobs', tab: 'system' },
  { key: 'flows', label: 'Flows', sub: 'sequence · state · process', tab: 'system' },
  { key: 'entities', label: 'Entities', sub: 'data model', tab: 'system' },
  { key: 'questions', label: 'Open questions', sub: 'need a decision', tone: 'warn', tab: 'decisions' },
];

function stat(s) {
  return `<button class="stat ${s.tone || ''}" data-act="tab" data-id="${s.tab}"><div class="sl">${esc(s.label)}</div><div class="sv">${esc(s.value)}</div><div class="ss">${esc(s.sub)}</div></button>`;
}

function coverageTone(st) {
  if (st.uncovered) return 'bad';
  return st.partial ? 'warn' : 'ok';
}

function coreStats(st) {
  return [
    { label: 'Requirement coverage', value: st.coveragePct + '%', sub: `${st.covered} covered · ${st.partial} partial · ${st.uncovered} missing`, tone: coverageTone(st), tab: 'trace' },
    { label: 'In scope', value: st.inScope, sub: `${st.deferred} deferred${st.synthetic ? ` · ${st.synthetic} synthetic` : ''}`, tab: 'trace' },
    { label: 'Acceptance criteria traced', value: `${st.acsTraced}/${st.acsInScope}`, sub: 'linked to concrete plan items', tone: st.acsTraced < st.acsInScope ? 'warn' : 'ok', tab: 'trace' },
  ];
}

function statsBlock(st) {
  const counts = PANEL_COUNT_STATS.filter((c) => st[c.key]).map((c) => ({ ...c, value: st[c.key] }));
  return `<div class="stats">${[...coreStats(st), ...counts].map(stat).join('')}</div>`;
}

function coverageBar(st) {
  const tot = Math.max(1, st.inScope);
  const parts = [['covered', st.covered], ['partial', st.partial], ['uncovered', st.uncovered]];
  return `<div class="covbar" title="covered / partial / missing">${parts.map(([c, n]) => `<span class="${c}" style="width:${(n / tot) * 100}%"></span>`).join('')}</div>`;
}

function issueItem(i) {
